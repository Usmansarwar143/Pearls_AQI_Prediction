name: daily-feature-pipeline

on:
  schedule:
    - cron: '1 19 * * *' # Runs at 12:01 AM PKT (UTC+5) every day
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-daily-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update script
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: |
          # Create data directories if they don't exist
          mkdir -p data/raw
          mkdir -p data/processed
          
          # Run script
          python src/feature_pipeline/daily_update.py

      - name: Generate static predictions
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: |
          python src/web_app/generate_predictions.py

      - name: Commit predictions.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/predictions.json
          git diff --staged --quiet || (git commit -m "chore: Update daily predictions" && git push)
